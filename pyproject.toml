[tool.poetry]
name = "vol-radar"
version = "0.1.0"
description = "Global Equity Volatility Dislocation Radar with automated backtests"
authors = ["Sumit Thakkar <thakkarsumit972@gmail.com>"]
readme = "README.md"
packages = [{include = "vol_radar", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
sqlalchemy = ">=2.0,<3.0"
pandas = ">=2.0,<3.0"
numpy = ">=1.24,<2.0"
yfinance = ">=0.2,<1.0"
pyyaml = ">=6.0,<7.0"
scipy = ">=1.10,<2.0"
statsmodels = ">=0.14,<1.0"
scikit-learn = ">=1.3,<2.0"
plotly = ">=5.15,<6.0"
streamlit = ">=1.30,<2.0"
loguru = ">=0.7,<1.0"
click = ">=8.0,<9.0"
requests = ">=2.28,<3.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0,<9.0"
pytest-cov = ">=4.0,<6.0"
ruff = ">=0.1,<1.0"

[tool.poetry.scripts]
vol-radar = "vol_radar.__main__:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
